name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/releases.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号并检查是否已发布
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "标签 $TAG 已存在，版本未更新，跳过发布。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "检测到新版本 $TAG，开始构建并发布。"
          fi

      - name: 安装 Bun
        if: steps.check.outputs.published == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        if: steps.check.outputs.published == 'false'
        run: bun install

      - name: 构建
        if: steps.check.outputs.published == 'false'
        run: bun run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出构建产物
        if: steps.check.outputs.published == 'false'
        shell: bash
        run: ls -lh dist

      - name: 提取 Git 提交记录并前置过滤
        if: steps.check.outputs.published == 'false'
        shell: bash
        run: |
          echo "[INFO] 查找上一个版本 Tag..."
          LAST_TAG=$(git describe --tags --abbrev=0 "${{ github.sha }}^" 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            echo "[INFO] 上一版本 Tag: $LAST_TAG，提取提交范围: $LAST_TAG..${{ github.sha }}"
            git log "$LAST_TAG..${{ github.sha }}" --pretty=format:"* %s (%h)" --no-merges > RAW_COMMITS.txt
          else
            echo "[WARN] 未找到历史 Tag，提取最近 50 条提交..."
            git log -n 50 --pretty=format:"* %s (%h)" --no-merges > RAW_COMMITS.txt
          fi

          # 从源头强力剔除所有工程、配置、版本升级、文件后缀类的噪音行
          grep -viE "(\.yml|\.json|\.md|release|bump|workflow|actions|ci|build|chore\(|style\(|refactor\()" RAW_COMMITS.txt > FILTERED_COMMITS.txt || true

          # 若全部被过滤完，回退使用原始提交，避免给 AI 传入空内容
          if [ ! -s FILTERED_COMMITS.txt ]; then
            cp RAW_COMMITS.txt FILTERED_COMMITS.txt
          fi

          echo "[INFO] 清洗后保留的有效功能提交数: $(wc -l < FILTERED_COMMITS.txt)"

      - name: 生成发行版说明
        if: steps.check.outputs.published == 'false'
        id: release_notes
        shell: bash
        env:
          AI_RELEASE: ${{ secrets.AI_Release }}
        run: |
          node -e '
            const fs = require("fs");
            const rawCommits = fs.readFileSync("FILTERED_COMMITS.txt", "utf8").trim();

            function fallback(reason) {
              console.log("[WARN] 降级使用原始提交日志，原因:", reason);
              fs.writeFileSync("GENERATED_RELEASE.md", "### 更新日志\n\n" + rawCommits, "utf8");
              process.exit(0);
            }

            function parseConfig(raw) {
              const config = {};
              if (!raw) return config;
              const lines = raw.split(/\r?\n/);
              for (const line of lines) {
                const match = line.match(/^\s*([A-Za-z0-9_]+)\s*[:=]\s*(?:"([^"]*)"|'\''([^'\'']*)'\''|(.*))\s*$/);
                if (match) {
                  const key = match[1].toUpperCase();
                  const val = (match[2] ?? match[3] ?? match[4] ?? "").trim();
                  if (val) config[key] = val;
                }
              }
              return config;
            }

            const parsed = parseConfig(process.env.AI_RELEASE);
            const key = parsed.KEY || "";
            const url = parsed.URL || "";
            const model = parsed.MODEL || "";

            if (!key || !url || !model) {
              fallback("缺少 AI_RELEASE 配置");
            }

            async function run() {
              console.log("[INFO] 正在调用 AI 生成发行版说明...");
              let promptTemplate = "";
              try {
                promptTemplate = fs.readFileSync(".github/workflows/releases_prompt.md", "utf8");
              } catch (e) {
                fallback("读取 releases_prompt.md 失败: " + e.message);
              }

              const prompt = promptTemplate.replace("{{commits}}", rawCommits);

              let endpoint = url.replace(/\/+$/, "");
              if (!endpoint.endsWith("/chat/completions")) {
                endpoint += "/chat/completions";
              }

              try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const res = await fetch(endpoint, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${key}`
                  },
                  body: JSON.stringify({
                    model: model,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.2
                  }),
                  signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!res.ok) {
                  const errText = await res.text();
                  fallback(`API 返回错误 ${res.status}: ${errText}`);
                }

                const data = await res.json();
                let text = data.choices?.[0]?.message?.content || "";
                text = text.trim();

                if (text.startsWith("```markdown")) {
                  text = text.replace(/^```markdown\s*/, "").replace(/\s*```$/, "");
                } else if (text.startsWith("```")) {
                  text = text.replace(/^```\s*/, "").replace(/\s*```$/, "");
                }

                if (text.length > 5) {
                  console.log("[INFO] 发行版说明生成完毕。");
                  fs.writeFileSync("GENERATED_RELEASE.md", text, "utf8");
                  return;
                } else {
                  fallback("AI 返回内容过短");
                }
              } catch (err) {
                fallback("请求异常: " + err.message);
              }
            }

            run();
          '
          echo "path=GENERATED_RELEASE.md" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: steps.check.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 Actions 缓存
        if: ${{ !cancelled() && steps.check.outputs.published == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[INFO] 清理 Actions 缓存..."
          gh cache delete --all --repo "$GITHUB_REPOSITORY" || echo "[INFO] 没有可清理的缓存。"