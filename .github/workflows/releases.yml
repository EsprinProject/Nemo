name: Release

# 当 package.json 被推送到 main 分支时触发（版本号更新即代表有新版本需要发布）
on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/releases.yml
  workflow_dispatch:

permissions:
  # 创建 Release / 推送 tag 需要写权限
  contents: write
  # 清理 Actions 缓存需要 actions 权限
  actions: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    env:
      # 无代码签名证书，跳过自动查找证书
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 需要完整的 tag 历史来判断该版本是否已经发布过
          fetch-depth: 0

      - name: 读取版本号并检查是否已发布
        id: check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "标签 $TAG 已存在，版本未更新，跳过发布。"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "检测到新版本 $TAG，开始构建并发布。"
          fi

      - name: 安装 Bun
        if: steps.check.outputs.published == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        if: steps.check.outputs.published == 'false'
        run: bun install

      - name: 构建
        if: steps.check.outputs.published == 'false'
        run: bun run build
        env:
          # electron-builder 检测到 CI 环境后会尝试连接 GitHub 处理草稿 Release，
          # 缺少 token 时会直接报错中断打包，因此这里必须提供 GH_TOKEN。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 列出构建产物
        if: steps.check.outputs.published == 'false'
        shell: bash
        run: ls -lh dist

      - name: 生成发行版说明
        if: steps.check.outputs.published == 'false'
        id: release_notes
        shell: bash
        env:
          AI_RELEASE: ${{ secrets.AI_Release }}
        run: |
          echo "收集 git 提交历史..."
          LAST_TAG=$(git describe --tags --abbrev=0 "${{ github.sha }}^" 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            # 过滤 merge 提交与纯发版/版本号变更类提交
            COMMITS=$(git log "$LAST_TAG..${{ github.sha }}" --pretty=format:"* %s (%h)" --no-merges | grep -viE "^\*\s*(bump|release|chore\(release\)|chore: release)" || echo "")
          else
            COMMITS=$(git log -n 15 --pretty=format:"* %s (%h)" --no-merges | grep -viE "^\*\s*(bump|release|chore\(release\)|chore: release)" || echo "")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="* 无新增功能提交（纯维护或版本号变更）"
          fi

          COMMITS="$COMMITS" node -e '
            const fs = require("fs");
            const commits = process.env.COMMITS || "";

            // 解析机密配置
            function parseConfig(raw) {
              const config = {};
              if (!raw) return config;
              const lines = raw.split(/\r?\n/);
              for (const line of lines) {
                const match = line.match(/^\s*([A-Za-z0-9_]+)\s*[:=]\s*(?:"([^"]*)"|'\''([^'\'']*)'\''|(.*))\s*$/);
                if (match) {
                  const key = match[1].toUpperCase();
                  const val = (match[2] ?? match[3] ?? match[4] ?? "").trim();
                  if (val) config[key] = val;
                }
              }
              return config;
            }

            const parsed = parseConfig(process.env.AI_RELEASE);
            const key = parsed.KEY || "";
            const url = parsed.URL || "";
            const model = parsed.MODEL || "";

            async function run() {
              const fallbackContent = "常规维护与优化\n\n- 本次为内部工程维护，无可见的功能与界面变更";

              if (!key || !url || !model) {
                console.log("未提供完整的 AI_RELEASE 机密配置（需包含 URL, KEY, MODEL），使用默认说明。");
                fs.writeFileSync("GENERATED_RELEASE.md", fallbackContent, "utf8");
                return;
              }

              console.log("正在调用 AI 生成发行版说明...");
              const promptTemplate = fs.readFileSync(".github/workflows/releases_prompt.md", "utf8");
              const prompt = promptTemplate.replace("{{commits}}", commits);

              try {
                let endpoint = url.replace(/\/+$/, "");
                if (!endpoint.endsWith("/chat/completions")) {
                  endpoint += "/chat/completions";
                }

                const res = await fetch(endpoint, {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${key}`
                  },
                  body: JSON.stringify({
                    model: model,
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.2
                  })
                });

                const data = await res.json();
                let text = data.choices?.[0]?.message?.content || "";
                text = text.trim();
                if (text.startsWith("```markdown")) {
                  text = text.replace(/^```markdown\s*/, "").replace(/\s*```$/, "");
                } else if (text.startsWith("```")) {
                  text = text.replace(/^```\s*/, "").replace(/\s*```$/, "");
                }

                if (text) {
                  fs.writeFileSync("GENERATED_RELEASE.md", text, "utf8");
                  return;
                }
              } catch (err) {
                console.error("AI 生成失败:", err);
              }

              fs.writeFileSync("GENERATED_RELEASE.md", fallbackContent, "utf8");
            }

            run();
          '
          echo "path=GENERATED_RELEASE.md" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        if: steps.check.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.release_notes.outputs.path }}
          draft: false
          prerelease: false
          # 发布 electron-builder 打出的两个 exe：Setup 与 Portable
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理 Actions 缓存
        # 无论构建/发布成功与否都执行，避免缓存不断累积占满仓库配额
        if: ${{ !cancelled() && steps.check.outputs.published == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "清理 $GITHUB_REPOSITORY 的 Actions 缓存..."
          gh cache delete --all --repo "$GITHUB_REPOSITORY" || echo "没有可清理的缓存。"